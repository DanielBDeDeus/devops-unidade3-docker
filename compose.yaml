name: ceub-devops-unidade3
services:
  staging:
    image: devops-webapi:1.1.0
    container_name: devops-api-staging
    labels:
      ceub.devops.lab: ceub-devops-unidade3
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      APP_ENVIRONMENT: staging
      APP_VERSION: "1.1.0"
    healthcheck:
      test: ["CMD", "dotnet", "DevOpsWebApi.dll", "--health-check"]
      interval: 5s
      timeout: 5s
      retries: 4
      start_period: 5s
  production:
    image: devops-webapi:1.1.0
    container_name: devops-api-prod
    labels:
      ceub.devops.lab: ceub-devops-unidade3
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      APP_ENVIRONMENT: production
      APP_VERSION: "1.1.0"
    healthcheck:
      test: ["CMD", "dotnet", "DevOpsWebApi.dll", "--health-check"]
      interval: 5s
      timeout: 5s
      retries: 4
      start_period: 5s
